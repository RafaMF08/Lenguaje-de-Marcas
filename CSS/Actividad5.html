<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            color: cyan;
            font-family: Arial;
            border: 1px solid black;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>
    <!--Los párrafos no heredan el borde, ya que la página entera tendra el borde-->
    <h1>Actividad 5</h1>
    <a href="https://www.google.com">Este es un enlace</a>
    <!--Los enlaces no cambian de color porque tienen un color
    predeterminado del navegador que prevalece sobre el color heredado del body.-->
    <!--Con inherit ya si que prevalece el color del body-->
</body>

</html>
