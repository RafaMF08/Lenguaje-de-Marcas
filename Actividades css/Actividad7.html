<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad - Contraste WCAG</title>
</head>
<body>

  <!-- 
    ========================================================================
    Requisitos
    ========================================================================
    1. Nivel AA:
       - Texto normal: Ratio mínimo de 4.5:1
       - Texto grande: Ratio mínimo de 3:1

    2. Nivel AAA:
       - Texto normal: Ratio mínimo de 7:1
       - Texto grande: Ratio mínimo de 4.5:1

    3. Definición de "Texto Grande":
       - Al menos 18 pt (~24 px) en peso normal.
       - Al menos 14 pt (~18.66 px) si está en negrita (bold).
       - Todo lo inferior a esto se considera "texto normal".

    ========================================================================
    Combinaciones
    ========================================================================
    1. Google (Resultados de búsqueda)
       - Texto: #1f1f1f | Fondo: #ffffff
       - Ratio aprox: 16.1:1
       - Estado: Cumple AA y AAA (tanto texto normal como grande).

    2. Wikipedia (Cuerpo de artículo)
       - Texto: #202122 | Fondo: #ffffff
       - Ratio aprox: 15.4:1
       - Estado: Cumple AA y AAA (tanto texto normal como grande).

    3. GitHub (Modo oscuro - Texto principal)
       - Texto: #c9d1d9 | Fondo: #0d1117
       - Ratio aprox: 13.2:1
       - Estado: Cumple AA y AAA (tanto texto normal como grande).

    4. Bootstrap / Botón Primario (Azul estándar)
       - Texto: #ffffff | Fondo: #0d6efd
       - Ratio aprox: 4.6:1
       - Estado: Cumple AA (texto normal y grande). No cumple AAA para texto normal.

    5. Twitter / X (Modo claro - Texto secundario/metadatos)
       - Texto: #536471 | Fondo: #ffffff
       - Ratio aprox: 4.5:1
       - Estado: Cumple AA (justo en el límite para texto normal). No cumple AAA.
  -->

</body>
</html>
