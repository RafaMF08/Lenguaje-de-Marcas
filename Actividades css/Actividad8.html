<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad 8 - em vs rem</title>
  <style>
    .texto-rem {
      font-size: 1.25rem; /* Relativo al navegador */
    }
    .texto-px {
      font-size: 20px;     /* Tamaño absoluto rígido */
    }
  </style>
</head>
<body>

  <ul>
    <li>Nivel 1 - Elemento A</li>
    <li>Nivel 2 - Elemento A.1</li>
    <li>Nivel 3 - Elemento A.1.1</li>
  </ul>
  <p class="texto-rem">Este texto usa REM.</p>
  <p class="texto-px">Este texto usa PX.</p>

</body>
</html>
