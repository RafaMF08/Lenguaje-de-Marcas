
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad 3</title>
</head>
<body>

  <h2 style="color: darkmagenta;">Formulario GET</h2>
  <form action="https://httpbin.org/get" method="GET">
    <br>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    </br>

    <br>
    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo">
    </br>

    <br>
    <label for="comentario">Comentario:</label>
    <input type="text" id="comentario" name="comentario">
    </br>

    <button type="submit">Enviar</button>
  </form>

  <hr>

  <h2 style="color: crimson;">Formulario POST</h2>
  <form action="https://httpbin.org/post" method="POST">
    <br>
    <label for="nombre2">Nombre:</label>
    <input type="text" id="nombre2" name="nombre">
    </br>

    <br>
    <label for="correo2">Correo:</label>
    <input type="email" id="correo2" name="correo">
    </br>

    <br>
    <label for="comentario2">Comentario:</label>
    <input type="text" id="comentario2" name="comentario">
    </br>

    <button type="submit">Enviar</button>
  </form>

</body>
</html>
