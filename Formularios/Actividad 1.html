<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <br>
    <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
    </br>

    <br>    
    <label for="codigo_postal">Código postal:</label>
        <input type="text" id="codigo_postal" name="codigo_postal" autocomplete="codigo_postal"  inputmode="numeric" required>
    </br>

    <br>    
    <label for="número_asistentes">Número de asistentes:</label>
        <input type="number" id="asistentes" name="asistentes" min="1" max="8" step="1" required>
    </br>

    <br>    
    <label for="fecha_cita">Fecha de la cita:</label>    
        <input type="date" id="fecha_cita" name="fecha_cita" min="2026-11-01" required>
    </br>
    
    <br>    
    <label for="provincia_residencia">Provincia de residencia:</label>    
        <input type="number" id="provincia_residencia" name="provincia_residencia" min="1" max="52" required>
    </br>
    
    <br>    
    <label for="nivel_satisfaccion">Nivel de ssatisfacción del 1 al 10:</label>    
        <input type="number" id="nivel_satisfaccion" name="nivel_satisfaccion" min="1"  max="10" required>
    </br>

    <br>    
    <label for="contraseña">Contraseña:</label>    
        <input type="password" id="contraseña" name="contraseña" autocomplete="new-password" minlength="12" required>
    </br>

    <br>    
    <label for="comentario">Comentario (hasta 300 carácteres):</label>    
        <textarea type="text" id="comentario" name="comentario" maxlength="300" rows="5"></textarea>
    </br>
</body>
</html>
